const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function brochureLabel(r){return r.file?"查看 PDF":r.status==='product_page'||r.id==='delta-ai'?"仅产品页 · 未核实到公开彩页 PDF":r.status==='pdf_link'||r.id==='eaton-800vdc'?"官方 PDF":"官方下载入口";}
function render(){
 const query=$('search').value.trim().toLowerCase();
 const rows=[...DOCS].sort((a,b)=>Number(Boolean(b.thumbnail))-Number(Boolean(a.thumbnail))).filter(r=>(!$('brand').value||r.company===$('brand').value)&&(!$('type').value||r.category===$('type').value)&&[r.company,r.title,r.category].join(' ').toLowerCase().includes(query));
 $('count').textContent=rows.length+' 项 · 供 MEGMEET 产品彩页制作参考';
 $('grid').innerHTML=rows.map(r=>`<article class="brochure"><a class="cover" href="${esc(r.file||r.source)}" target="_blank" rel="noopener noreferrer" aria-label="查看 ${esc(r.title)}">${r.thumbnail?`<img src="${esc(r.thumbnail)}" alt="${esc(r.title)} 彩页封面" loading="lazy">`:`<span class="resource-cover" aria-hidden="true"><span class="resource-cover-brand">${esc(r.company)}</span><span class="resource-cover-title">${esc(r.title)}</span><span class="resource-cover-kind">${r.status==='product_page'||r.id==='delta-ai'?"产品页":r.status==='pdf_link'||r.id==='eaton-800vdc'?"官方 PDF":"下载入口"}</span></span>`}</a><div class="brochure-info"><small>${esc(r.company)} · ${esc(r.category)}${r.pages?' · '+r.pages+' 页':''}</small><h3>${esc(r.title)}</h3><div class="actions"><a href="${esc(r.file||r.source)}" target="_blank" rel="noopener noreferrer">${esc(brochureLabel(r))} ↗</a>${r.file?`<a href="${esc(r.file)}" download>下载</a>`:''}<a href="${esc(r.source)}" target="_blank" rel="noopener noreferrer">官方来源 ↗</a></div></div></article>`).join('')||'<p class="empty">没有匹配结果，请调整筛选。</p>';
}
for(const brand of new Set(DOCS.map(d=>d.company)))$('brand').add(new Option(brand,brand));
for(const type of new Set(DOCS.map(d=>d.category)))$('type').add(new Option(type,type));
$('search').oninput=render;$('brand').onchange=render;$('type').onchange=render;render();
