  .detail-row td { padding: 0; border-bottom: 2px solid var(--accent); background: #fafbfc; }

  .rel-supply { background: #e6f4ea; color: #137333; }
  .rel-customer { background: #e8f0fe; color: #1967d2; }
  .rel-peer { background: #f1f3f4; color: #5f6368; }

  #loading { text-align: center; padding: 80px 20px; color: var(--text-secondary); font-size: 16px; }
  #loading.hidden { display: none; }

  .footer {
    text-align: center; padding: 40px 20px 32px;
    color: var(--text-secondary); font-size: 12px;
  }
  .footer a { color: var(--accent); text-decoration: none; }
  .footer p { margin-top: 8px; }

  @media (max-width: 768px) {
    .nav-inner { height: auto; padding: 8px 0; gap: 8px; }

    th, td { padding: 8px; font-size: 11px; }
    .co-note { max-width: 120px; }
    .detail-card { grid-template-columns: 1fr 1fr; }
  }

function reportBadge(c) {
  if (!safeUrl(c.report_url)) return '—';
  const styles = { SEC:'badge-sec', PDF:'badge-pdf', IR:'badge-ir', Private:'badge-private' };
  const year = c.report_verified && c.report_year
    ? (/edition|report version|报告版本/i.test(c.year_basis || '') ? ' · Version ' : ' · FY') + c.report_year
    : '';
  return link(c.report_url, (c.report_label || '报告') + year, 'badge ' + (styles[c.report_label] || 'badge-review'));
}

function evidenceHtml(items){return `<ul>${items.map(e=>`<li><span class="evidence-state ${e.state==='已确认'?'evidence-confirmed':e.state==='推断'?'evidence-inferred':'evidence-unknown'}">${esc(e.state)}</span> ${e.url?link(e.url,e.title):esc(e.title)}<span class="small">${esc(e.claim)}</span></li>`).join('')}</ul>`;}
function roleStatus(c){return c.stage>=4?'角色较清晰':c.stage===3?'角色部分清晰':'仅确认平台模式';}
function bulletList(items,extra=''){return `<ul class="finding-list ${extra}">${items.map(item=>`<li>${esc(item)}</li>`).join('')}</ul>`;}
function activityTimeline(c){const events=c.activity2026;return `<h4>2026 年公开动态</h4>${events.length?'<ul class="finding-list project-timeline">'+events.map(e=>`<li><time datetime="${esc(e.date)}">${esc(e.date)}</time> · ${esc(e.claim)} <span class="small">${link(e.url,e.title)}</span></li>`).join('')+'</ul>':'<p class="small">截至 2026-11-19，本轮未找到可核实的 2026 年带日期项目更新。</p>'}`;}
function opportunityCard(c){return `<details class="case-row"><summary><span class="case-company">${esc(c.company)}</span><span class="case-project"><strong>${esc(c.project)}</strong><br>${esc(c.locationScale)}</span><span class="case-status ${c.stage===1?'status-limited':''}">${roleStatus(c)}</span></summary><div class="case-detail">${activityTimeline(c)}<h4>已确认</h4>${bulletList(c.confirmed)}<h4>仍待核实</h4>${bulletList(c.unconfirmed,'unconfirmed')}<details class="evidence-list"><summary>数据来源 · ${c.evidence.length}条</summary>${evidenceHtml(c.evidence)}</details></div></details>`;}

function renderSales(){const q=document.getElementById('search').value.trim().toLocaleLowerCase();const rows=SALES_PILOT.filter(c=>!q||[c.company,c.businessModel,c.project,c.locationScale,c.limit,...c.roles,...c.confirmed,...c.unconfirmed,...c.evidence.map(e=>e.claim),...c.activity2026.flatMap(e=>[e.date,e.claim])].join(' ').toLocaleLowerCase().includes(q));filteredData=rows;document.getElementById('navStats').textContent=`${rows.length} / ${SALES_PILOT.length} 案例`;return `<section class="section" id="project-cases"><div class="sales-section-header"><div><h1 id="role-validation" data-outline-target>商机思路</h1><p>从客户池定位重点对象，再沿具体项目查清需求与采购路径。</p><p>2026 年公开动态核查截至 11 月 19 日。项目目标按公告列示，实际交付以公开确认为准。</p></div><span class="count">${rows.length} 个案例</span></div><div class="opportunity-overview"><section class="overview-section"><h2 id="opportunity-paths" data-outline-target>检索思路</h2><ol class="overview-list"><li class="overview-item"><h3>1. 直接进入 OEM / ODM</h3><p>服务器和整机柜厂商直接需要 Power Shelf、PSU、BBU 和 DC/DC，通常负责电源选型、验证、AVL 准入或采购。</p></li><li class="overview-item"><h3>2. 从云厂商项目反查需求</h3><p>云厂商是终端需求方。先找到其在建或扩建项目，再追踪负责设计、集成和采购的 OEM、ODM 与合作伙伴。</p></li></ol></section><section class="overview-section"><h2 id="customer-pool-tiers" data-outline-target>客户池分层</h2><ul class="overview-list"><li class="overview-item"><h3>核心直接客户</h3><p><b>AI服务器 / Rack / ODM / OEM。</b>Dell、HPE、Supermicro、Foxconn/FII、Quanta、Wiwynn、Wistron、Inventec、QCT、Celestica、Flex 等，最可能直接参与电源选型、验证、AVL 准入或采购。</p></li><li class="overview-item"><h3>重点终端客户</h3><p><b>云厂商 / Hyperscaler / Neocloud。</b>Microsoft Azure、AWS、Google Cloud、Oracle、CoreWeave、Nebius、Crusoe、Lambda、IREN、Nscale、Fluidstack 等产生需求并可能制定规格；仍需调查其背后的 OEM、ODM 和实际采购主体。</p></li><li class="overview-item"><h3>条件型客户</h3><p><b>数据中心业主 / AI Factory。</b>重点保留 Applied Digital、Crusoe、Nebius、CoreWeave、Lancium 等具备硬件采购或算力运营能力的公司。Equinix、Digital Realty、Vantage、QTS 等纯 Colo 企业更适合作为项目信息来源。</p></li><li class="overview-item"><h3>自建 AI 集群的企业</h3><p>保留 Meta、xAI、Google、Microsoft、Amazon、Apple、Oracle 等自建基础设施的企业。Tesla 在得州超级工厂自建并运营 Cortex 训练集群，可作为终端需求方跟踪；具体项目需继续核实服务器厂商、整机柜交付方与实际采购主体。Salesforce、Adobe、ServiceNow、SAP、Cohere 等主要使用外部云服务，不纳入麦格米特直接客户池。</p></li></ul></section><section class="overview-section"><h2 id="customer-entry-standard" data-outline-target>商机入池标准</h2><ul class="overview-points"><li>设计或集成 AI 服务器、整机柜</li><li>负责电源规格、验证或 AVL 准入</li><li>直接采购服务器、Power Shelf、BBU 或机柜电源系统</li><li>自建并持有 AI 算力设备</li></ul></section><section class="overview-section"><h2 id="public-evidence-boundary" data-outline-target>公开资料的可获得性</h2><div class="evidence-boundary"><p><b>公开资料通常能查到：</b>项目名称、地点、建设阶段、规模和公开合作方。</p><p><b>部分项目能查到：</b>资产持有方、服务器 OEM、系统集成方和架构影响方。</p><p><b>公开资料通常查不到：</b>电源 BOM、AVL、验证负责人、批准流程和最终 PO 主体。</p></div></section></div>${CASE_GROUPS.map(group=>caseGroup(group,rows)).join('')||'<p class="empty">没有匹配的项目案例。</p>'}</section>`;}

function brochureCards(records){
  return records.map(r=>`<article class="brochure-card">
    <a class="brochure-cover" href="${esc(r.file||r.source)}" target="_blank" rel="noopener noreferrer" aria-label="查看 ${esc(r.title)}">${r.thumbnail?`<img src="${esc(r.thumbnail)}" alt="${esc(r.title)} 彩页首页" loading="lazy">`:`<span class="brochure-placeholder">${esc(r.company)}<br>${r.id==='delta-ai'?'官方产品介绍':'官方彩页下载页'}</span>`}</a>
    <div class="brochure-info"><div class="brochure-meta">${esc(r.company)} · ${esc(r.category)}</div><h4>${esc(r.title)}</h4>
    <div class="brochure-meta">${esc(r.format)}${r.pages?' · '+r.pages+' 页':''}${r.status==='source_only'?' · 从官网获取':''}</div>
    <div class="brochure-meta">版本 ${esc(r.version)}<br>收集日期 ${esc(r.checked)}</div>
    <div class="brochure-actions"><a href="${esc(r.file||r.source)}" target="_blank" rel="noopener noreferrer">${r.file?'查看彩页 ↗':r.id==='delta-ai'?'查看产品介绍 ↗':'查看官方下载页 ↗'}</a>${r.file?`<a href="${esc(r.file)}" download>下载 PDF</a>`:''}<a href="${esc(r.source)}" target="_blank" rel="noopener noreferrer">官方来源 ↗</a></div></div></article>`).join('');
}

function relatedBrochures(c){
  const records=BROCHURES.filter(r=>r.company===(c.brochure_brand||({"Flex Power":"Flex Power","Bel Power":"Bel","FSP Group":"FSP","Murata Power":"Murata","OmniOn Power":"OmniOn","Delta Electronics":"Delta","Lite-On":"LITEON"})[c.name]||c.name));

function detail(c){let h='<div class="detail-card">';h+=field('公司 / 业务名称',esc(c.name));h+=field('集团 / 关联主体',esc(c.parent_company||'—'));h+=field('产业链位置',esc(c.value_chain_role)+' · '+esc(categoryName(c)));h+=field('商机判断',commercialBrief(c),true);const f=c.financial;if(f){h+=field('年度财务摘要',`<strong>${esc(f.subject)}</strong><p>${esc(f.period)} · ${esc(f.currency)}</p><p>营业收入：<strong>${esc(f.revenue)}</strong></p><p>${esc(f.profit)}</p><p class="small">${esc(f.note)}</p><p>${link(f.url,'查看财务报告 / 官方业绩公告 ↗')}</p>`,true);}else{h+=field('年度财务摘要','数据待补充。'+(c.report_url?' '+link(c.report_url,'查看财务资料入口 ↗'):''),true);}h+=field('报告',c.report_url?link(c.report_url,c.report_title):'资料待补充');h+=field('报告主体',esc(c.report_scope||c.parent_company||'待核实'));h+=reportReview(c);if(c.sources.length)h+=field('来源与技术资料',resources(c.sources),true);h+=relatedBrochures(c);return h+'</div>';}
const outlineLinks=document.getElementById('outlineLinks');
const outlineDrawer=document.getElementById('outlineDrawer');
document.getElementById('outlineToggle').addEventListener('click',()=>outlineDrawer.showModal());
document.getElementById('outlineClose').addEventListener('click',()=>outlineDrawer.close());
outlineDrawer.addEventListener('click',event=>{
  if(event.target!==outlineDrawer)return;
  const {left,right,top,bottom}=outlineDrawer.getBoundingClientRect();
  if(event.clientX<left||event.clientX>right||event.clientY<top||event.clientY>bottom)outlineDrawer.close();
});
outlineLinks.addEventListener('click',event=>{
  if(event.target.closest('a')&&!event.ctrlKey&&!event.metaKey&&!event.shiftKey&&!event.altKey)outlineDrawer.close();
});
const topNav=document.querySelector('.nav');
const viewToolbar=document.getElementById('views');
let outlineEntries=[];
let outlineFrame=0;
function updateOutline(){
  outlineFrame=0;
  const stickyNavHeight=getComputedStyle(topNav).position==='sticky'?topNav.getBoundingClientRect().height:0;

  const contentOffset=stickyNavHeight+8;
  document.documentElement.style.setProperty('--nav-height',stickyNavHeight+'px');
  document.documentElement.style.setProperty('--content-sticky-top',contentOffset+'px');
  const brochureHeading=document.getElementById('product-brochures')?.closest('.section')?.querySelector('.section-header');
  if(brochureHeading)document.documentElement.style.setProperty('--brochure-heading-height',brochureHeading.getBoundingClientRect().height+'px');
  let current=outlineEntries[0];
  for(const entry of outlineEntries){
    if(entry.target.getBoundingClientRect().top<=contentOffset+2)current=entry;
  }
  const page=document.scrollingElement;
  if(page.scrollTop>0&&Math.ceil(page.scrollTop+page.clientHeight)>=page.scrollHeight){
    current=outlineEntries.at(-1);
  }
  for(const entry of outlineEntries){
    if(entry===current)entry.link.setAttribute('aria-current','location');
    else entry.link.removeAttribute('aria-current');
  }
}
function queueOutlineUpdate(){
  if(!outlineFrame)outlineFrame=requestAnimationFrame(updateOutline);
}
function renderOutline(){
  outlineLinks.replaceChildren();
  outlineEntries=Array.from(document.querySelectorAll('main [data-outline-target]'),target=>{
    const item=document.createElement('li');
    const link=document.createElement('a');
    const heading=target.matches('.section')?target.querySelector('h2'):target;
    const level=Number(target.dataset.outlineLevel)||(heading.matches('h1,h2,h3,h4,h5,h6')?Number(heading.tagName[1]):2);
    item.style.setProperty('--outline-indent',level-1);
    link.href='#'+encodeURIComponent(target.id);
    const title=document.createElement('span');
    title.className='outline-title';
    title.textContent=heading.textContent.trim();
    link.append(title);
    if(target.dataset.outlineNote){
      const note=document.createElement('span');
      note.className='outline-note';
      note.textContent=target.dataset.outlineNote;
      link.append(note);
    }
    item.append(link);
    outlineLinks.append(item);
    return {target,link};
  });
  updateOutline();
}
window.addEventListener('scroll',queueOutlineUpdate,{passive:true});
new ResizeObserver(queueOutlineUpdate).observe(topNav);
new ResizeObserver(queueOutlineUpdate).observe(viewToolbar);
function render(){document.getElementById('customerFilters').hidden=activeView==='sales';if(activeView==='sales'){document.getElementById('content').innerHTML=renderSales();document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===activeView);b.setAttribute('aria-pressed',String(b.dataset.view===activeView))});renderOutline();return;}filteredData=getFiltered();document.getElementById('navStats').textContent=`${filteredData.length} / ${ALL_DATA.length} 条目`;let h='';for(const sector of getSectors()){const rows=filteredData.filter(c=>c.sector===sector);if(!rows.length)continue;h+=`<section class="section" id="sector-${encodeURIComponent(sector)}" data-outline-target><div class="section-header"><h2>${esc(sector)}</h2><span class="count">${rows.length} 条目</span></div><div class="table-wrap"><table><thead><tr>${[['name','公司'],['sector','行业'],['category','分类'],['role','与我们的关系'],['note','说明'],['report_label','报告']].map(([k,l])=>`<th scope="col" ${sortKey===k?'aria-sort="'+(sortAsc?'ascending':'descending')+'"':''}><button data-sort="${k}">${l}${sortKey===k?(sortAsc?' ↑':' ↓'):''}</button></th>`).join('')}</tr></thead><tbody>`;for(const c of rows){const open=expanded.has(c.id);h+=`<tr class="data-row" data-row="${c.id}"><td><button class="company-button" data-toggle="${c.id}" aria-expanded="${open}" aria-controls="detail-${c.id}">${open?'−':'+'} ${esc(c.name)}</button>${c.alias?`<span class="co-alias">${esc(c.alias)}</span>`:''}${c.is_new?'<span class="pill">NEW</span>':''}${c.profile_checked?'<span class="pill update">PROFILE</span>':''}</td><td>${esc(c.sector)}</td><td>${categoryButton(c)}</td><td>${opportunityRole(c)}</td><td><span class="co-note">${esc(c.note)}</span></td><td>${reportBadge(c)}</td></tr><tr class="detail-row" id="detail-${c.id}" ${open?'':'hidden'}><td colspan="6">${open?detail(c):''}</td></tr>`;}h+='</tbody></table></div>';if(sector==='AI 电力与功率电子基础设施')h+=brochureLibrary();h+='</section>';}document.getElementById('content').innerHTML=h||'<p class="empty">没有匹配条目。请尝试其他关键词，或重置筛选。</p>';document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===activeView);b.setAttribute('aria-pressed',String(b.dataset.view===activeView))});renderOutline();}
function toggle(id){const c=ALL_DATA.find(x=>x.id===id),r=document.getElementById('detail-'+id);if(!c||!r)return;const b=document.querySelector(`[data-toggle="${id}"]`);if(expanded.has(id)){expanded.delete(id);r.hidden=true;b.setAttribute('aria-expanded','false');b.textContent='+ '+c.name;}else{expanded.add(id);r.querySelector('td').innerHTML=detail(c);r.hidden=false;b.setAttribute('aria-expanded','true');b.textContent='− '+c.name;}}
document.getElementById('content').addEventListener('click',e=>{const sort=e.target.closest('[data-sort]');if(sort){if(sortKey===sort.dataset.sort)sortAsc=!sortAsc;else{sortKey=sort.dataset.sort;sortAsc=true;}render();return;}const category = e.target.closest('button[data-directory-category]');
  if (category) {

function openLinkedPowerSector(){
  let anchor;
  try{anchor=decodeURIComponent(location.hash.slice(1));}catch{return;}
  const power='AI 电力与功率电子基础设施';
  if(!['sector-'+encodeURIComponent(power),'product-brochures','brochure-library'].includes(anchor))return;
  if(activeView!=='all'||!document.getElementById(anchor)){
    activeView='all';
    if(!document.getElementById(anchor)){
      ['search','sectorFilter','categoryFilter','linkFilter','roleFilter'].forEach(id=>document.getElementById(id).value='');
      fillOptions('categoryFilter',getCategories(''));
    }
    render();
  }
  requestAnimationFrame(()=>{updateOutline();document.getElementById(anchor)?.scrollIntoView({block:'start'});});
}
window.addEventListener('hashchange',openLinkedPowerSector);
